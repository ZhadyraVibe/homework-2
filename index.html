<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="event">
    <h1 id="event-title">Ночь в музее</h1>
    <p class="event-text">15 ноября, 18:30</p>
    <p class="event-text">Музей космонавтики, проспект Мира, 111</p>
    <p class="event-text">Вечерняя программа с выставкой и экскурсиями</p>
    <button type="button" id="show-program" class="btn">Показать программу</button>
    <p id="program" class="note" hidden></p>
  </section>

  <form id="service-form" class="order" hidden>
    <h2>Выберите услуги</h2>
    <label class="option"><input type="checkbox" id="guide"> Экскурсия с гидом</label>
    <label class="option"><input type="checkbox" id="audio"> Аудиогид</label>
    <label class="option"><input type="checkbox" id="catalog"> Каталог выставки</label>
    <button type="submit" class="btn">Посчитать стоимость</button>
  </form>

  <p id="data-error" class="warning" hidden></p>
  <p id="choice-error" class="warning" hidden></p>

  <p id="result" class="total" hidden></p>
  <p id="report-json" class="code" hidden></p>

  <script src="app.js"></script>
</body>
</html>
